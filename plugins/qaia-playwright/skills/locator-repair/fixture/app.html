<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Locator Repair Fixture</title>
</head>
<body>
  <nav>
    <button data-testid="settings-btn" aria-label="Settings">&#9881;</button>
  </nav>
  <main>
    <section id="login">
      <h1>Sign in</h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" data-testid="email-input" />
        <label for="password">Password</label>
        <input id="password" type="password" data-testid="password-input" />
        <button id="submit-btn" type="submit" data-testid="login-submit">Log in</button>
      </form>
      <p id="welcome" hidden>Welcome back!</p>
    </section>
    <section id="cart">
      <h2>Cart</h2>
      <ul>
        <li>Widget A <button aria-label="Delete" data-testid="remove-0">x</button></li>
        <li>Widget B <button aria-label="Delete" data-testid="remove-1">x</button></li>
      </ul>
    </section>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('welcome').hidden = false;
    });
  </script>
</body>
</html>
