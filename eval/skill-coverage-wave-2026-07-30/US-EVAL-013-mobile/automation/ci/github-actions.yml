# QAIA — Playwright CI (GitHub Actions). Instantiated by qaia-playwright:automate (T4) from
# plugins/qaia-playwright/skills/automate/templates/github-actions.yml for US-EVAL-013.
# The generated suite is autonomous: it runs in your CI with no dependency on QAIA or a
# Claude session. Set secrets/URLs in repo settings — never commit them (T3).
#
# DELTA vs. the shipped template, and why (each one is a real requirement of THIS suite):
#  1. `npx playwright install` installs BOTH chromium and webkit. The template installs chromium
#     only; that would silently skip the whole `e2e-mobile-iphone` project, because
#     devices['iPhone 13'] resolves to defaultBrowserType 'webkit'. Mobile emulation is only
#     honest if the descriptor's own engine is the one that runs (state/01-extraction.md BR3).
#  2. working-directory is `automation`, not `tests` (this run's layout).
#  3. BASE_URL defaults to the public target; no API_TOKEN — this SUT has no API and no secret.
name: e2e-mobile

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    env:
      # Provide this in Settings → Secrets and variables → Actions. Never hard-code it.
      BASE_URL: ${{ vars.BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - run: npm ci
      # Both engines: chromium for devices['Pixel 7'], webkit for devices['iPhone 13'].
      - run: npx playwright install --with-deps chromium webkit

      # Retry/quarantine policy (T2): 0 automatic retries (masking instability would hide the
      # exact signal qaia-playwright:flaky-detect exists to surface). A test tagged @quarantine
      # by a human after a flaky-detect finding is excluded from the blocking run below but
      # still executed and reported separately, so it stays visible instead of disappearing.
      - name: Run Playwright suite (excludes @quarantine)
        run: npx playwright test --grep-invert "@quarantine"

      - name: Run quarantined tests (non-blocking, reported separately)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx playwright test --grep "@quarantine" --output=quarantine-results

      - name: Publish JUnit + HTML (qaia-playwright:run-report formats, T1)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qaia-reports
          path: |
            automation/junit.xml
            automation/results.json
            automation/playwright-report/
          retention-days: 14
