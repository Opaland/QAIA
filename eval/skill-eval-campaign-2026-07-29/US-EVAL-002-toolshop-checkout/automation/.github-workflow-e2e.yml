# QAIA — Playwright CI (GitHub Actions). Generated by qaia-playwright:automate (step 6, T4).
# The generated suite is autonomous: it runs in CI with no dependency on QAIA or a Claude session.
# Kept as `.github-workflow-e2e.yml` (not under a `.github/workflows/` path) since this campaign
# artifact lives inside an `eval/` folder, not a deployable repo root -- a real user would place
# this file at `.github/workflows/e2e.yml` in their own project.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval/skill-eval-campaign-2026-07-29/US-EVAL-002-toolshop-checkout/automation
    env:
      # Public demo target (docs/DEMO-TARGETS.md) -- no secret credentials involved (T3): the
      # only account used is the target's own published demo login, not a project secret.
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.practicesoftwaretesting.com' }}
      UI_BASE_URL: ${{ vars.UI_BASE_URL || 'https://practicesoftwaretesting.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eval/skill-eval-campaign-2026-07-29/US-EVAL-002-toolshop-checkout/automation/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Retry/quarantine policy (T2): 0 automatic retries (see playwright.config.js). A test
      # tagged @quarantine by a human after a flaky-detect finding would be excluded from the
      # blocking run and reported separately; none is quarantined yet on this suite.
      - name: Run Playwright suite (excludes @quarantine)
        run: npx playwright test --grep-invert "@quarantine"

      - name: Publish JUnit + HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: us-eval-002-toolshop-checkout-reports
          path: |
            eval/skill-eval-campaign-2026-07-29/US-EVAL-002-toolshop-checkout/automation/results.junit.xml
            eval/skill-eval-campaign-2026-07-29/US-EVAL-002-toolshop-checkout/automation/html-report/
          retention-days: 14
