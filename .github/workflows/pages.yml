name: Deploy static demo to GitHub Pages

# Publishes examples/expense-demo/static-demo/ (a client-side-mocked copy of the real
# expense-demo UI — see that folder's mock-backend.js for why a mock exists at all: GitHub
# Pages serves static files only, it cannot run the real app/server.js backend). This is a
# fixture for usability-heuristic-review/a11y-audit/visual-check, which review rendered UI —
# skills needing a real backend (security-surface, perf-check, automate) are still tested
# against `node app/server.js` locally, never against this static build.

on:
  push:
    branches: [main]
    paths:
      - 'examples/expense-demo/static-demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned by SHA, decision T15)

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: examples/expense-demo/static-demo

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
