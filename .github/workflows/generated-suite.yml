# Runs a QAIA-**generated** Playwright suite in a real CI, on a machine that has never seen a
# Claude session — the proof demanded by issue #60.
#
# Until 2026-08-01 the central promise of the automation layer ("the generated tests survive
# QAIA: they run in your CI, with no dependency on QAIA or a Claude session") had never been
# executed by anything other than the session that wrote the tests. This job is that execution.
# It is deliberately NOT a copy of the repository's own lint CI: it installs nothing from this
# repository, imports no QAIA skill, and reads no `plugins/` file. If QAIA disappeared, this job
# would still pass.
#
# The suite under test is the one generated by `qaia-playwright:automate` for US-EVAL-001
# (SauceDemo login gate) during the 2026-07-29 skill-eval campaign, run **unmodified** from
# where the campaign left it. The pipeline body below is the template that `automate` actually
# ships (`plugins/qaia-playwright/skills/automate/templates/github-actions.yml`); if the template
# is wrong, this job goes red, which is the entire point.
#
# Deviations from the shipped template, all four deliberate and none of them load-bearing:
#   1. `working-directory` points at the campaign suite instead of `tests/`, because that is
#      where the generated suite lives in this repository. The template assumes the suite sits
#      at the repo root, which is the normal case for a user.
#   2. Actions are pinned by commit SHA rather than by `@v4` tag, per this repository's own
#      supply-chain rule (decision T15). The template keeps tags because a pinned SHA in a
#      generated file rots silently for the user.
#   3. `API_TOKEN` is dropped: this suite authenticates against nothing. Keeping a reference to
#      a secret that does not exist would only teach a reader that the reference is decorative.
#   4. Triggers are `workflow_dispatch` plus a path filter, not every push. The target is
#      `saucedemo.com`, a public demo this project does not own: gating unrelated commits on a
#      third party's uptime would make `main`'s status a measure of someone else's availability,
#      and hammering a free shared demo on every commit is not ours to spend. A red run here
#      still means something is broken — it just does not block work it cannot speak to.
name: Generated suite (real CI proof, #60)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'eval/skill-eval-campaign-2026-07-29/US-EVAL-001-saucedemo-login/automation/**'
      - 'plugins/qaia-playwright/skills/automate/templates/**'
      - '.github/workflows/generated-suite.yml'
  pull_request:
    paths:
      - 'eval/skill-eval-campaign-2026-07-29/US-EVAL-001-saucedemo-login/automation/**'
      - 'plugins/qaia-playwright/skills/automate/templates/**'
      - '.github/workflows/generated-suite.yml'

permissions:
  contents: read

jobs:
  playwright:
    name: QAIA-generated Playwright suite (US-EVAL-001)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval/skill-eval-campaign-2026-07-29/US-EVAL-001-saucedemo-login/automation/tests
    env:
      # Left unset on purpose. The generated `playwright.config.js` falls back to
      # `https://www.saucedemo.com` when BASE_URL is empty, so this also exercises that the
      # fallback works — a user who forgets the repository variable gets a running suite, not a
      # cryptic empty-baseURL failure.
      BASE_URL: ${{ vars.BASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned by SHA, decision T15)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned by SHA, decision T15)
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eval/skill-eval-campaign-2026-07-29/US-EVAL-001-saucedemo-login/automation/tests/package-lock.json

      # `npm ci` (not `npm install`) so the committed lockfile is what gets installed: if the
      # generated package.json and package-lock.json ever disagree, this fails loudly here
      # rather than quietly resolving to different versions than the ones the suite was proven
      # against.
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Retry/quarantine policy (T2): 0 automatic retries (masking instability would hide the
      # exact signal qaia-playwright:flaky-detect exists to surface). A test tagged @quarantine
      # by a human after a flaky-detect finding is excluded from the blocking run below but
      # still executed and reported separately, so it stays visible instead of disappearing.
      - name: Run Playwright suite (excludes @quarantine)
        run: npx playwright test --grep-invert "@quarantine"

      - name: Run quarantined tests (non-blocking, reported separately)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx playwright test --grep "@quarantine" --output=quarantine-results

      # Uploaded whether the suite passed or failed. A CI that only keeps evidence of its green
      # runs is the one shape of evidence this project has no use for.
      - name: Publish JUnit + HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned by SHA, decision T15)
        with:
          name: qaia-generated-suite-reports
          path: |
            eval/skill-eval-campaign-2026-07-29/US-EVAL-001-saucedemo-login/automation/tests/junit.xml
            eval/skill-eval-campaign-2026-07-29/US-EVAL-001-saucedemo-login/automation/tests/results.json
            eval/skill-eval-campaign-2026-07-29/US-EVAL-001-saucedemo-login/automation/tests/playwright-report/
            eval/skill-eval-campaign-2026-07-29/US-EVAL-001-saucedemo-login/automation/tests/test-results/
          retention-days: 14
          if-no-files-found: warn
